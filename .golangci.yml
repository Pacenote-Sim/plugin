# golangci-lint v2 configuration. Validate with: golangci-lint config verify
#
# The same linter set as the server and the capture client. The dependency rule
# is the one that matters here: this module is a contract, and the day it grows
# an import of anything that is not the transport it stops being one that a
# plugin author can depend on cheaply.
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  show-stats: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - nilerr
    - nolintlint
    - paralleltest
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - thelper
    - unparam
    - unused
    - wrapcheck

  settings:
    depguard:
      rules:
        # The contract itself: the standard library and the transport, and
        # nothing else, ever. No database, no HTTP framework, no logging
        # library, and above all nothing from the server.
        contract-is-stdlib-and-transport:
          list-mode: strict
          files:
            - "!$test"
            - "!**internal/pb/**"
          allow:
            - $gostd
            - github.com/pacenote-sim/plugin
            - github.com/hashicorp/go-plugin
            - google.golang.org/grpc
        tests-use-testing-deps-only:
          list-mode: strict
          files:
            - "**_test.go"
          allow:
            - $gostd
            - github.com/pacenote-sim/plugin
            - github.com/hashicorp/go-plugin
            - google.golang.org/grpc
            - github.com/stretchr/testify
            - go.uber.org/goleak
            # depguard matches $gostd by nearest sorted prefix; "go.uber.org/goleak"
            # sorts between "go" and "go/build" and would shadow the go/* stdlib
            # tree, so it is listed explicitly.
            - go/
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - unnamedResult
        - hugeParam
    gosec:
      excludes:
        - G104 # duplicates errcheck
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    paralleltest:
      ignore-missing: false
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments are checked by revive
    testifylint:
      enable-all: true
    thelper:
      test:
        first: true
        name: true
        begin: true
    unparam:
      check-exported: false
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(

  exclusions:
    generated: lax
    warn-unused: false
    rules:
      # wrapcheck guards a boundary this module does not have: every error here
      # is either one of its own sentinels or the transport's, and both are
      # meant to travel as they are.
      - path: .
        linters:
          - wrapcheck
      - path: _test\.go
        linters:
          - gosec
      # protoc writes this tree. It is reviewed as a .proto, not as Go.
      - path: internal/pb/
        linters:
          - revive
          - unused
          - gocritic
          - unparam
          - staticcheck
          - govet

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/pacenote-sim/plugin
      extra-rules: false
    goimports:
      local-prefixes:
        - github.com/pacenote-sim/plugin
  exclusions:
    generated: lax
    paths:
      - internal/pb

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
